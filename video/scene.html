<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>70 פנים לתורה – סרטון</title>
<style>
  @font-face { font-family: Heebo; font-weight: 400; src: url(fonts/heebo-hebrew-400-normal.woff2); }
  @font-face { font-family: Heebo; font-weight: 700; src: url(fonts/heebo-hebrew-700-normal.woff2); }
  @font-face { font-family: Heebo; font-weight: 800; src: url(fonts/heebo-hebrew-800-normal.woff2); }
  @font-face { font-family: Frank; font-weight: 500; src: url(fonts/frank-ruhl-libre-hebrew-500-normal.woff2); }
  @font-face { font-family: Frank; font-weight: 700; src: url(fonts/frank-ruhl-libre-hebrew-700-normal.woff2); }
  @font-face { font-family: Frank; font-weight: 900; src: url(fonts/frank-ruhl-libre-hebrew-900-normal.woff2); }

  :root { --navy: #10151F; --navy2: #1B2438; --gold: #D4AF5A; --gold2: #F3DC9A; --cream: #F5F1E8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--navy); }
  body { font-family: Heebo, sans-serif; color: var(--cream); position: relative; }

  .layer { position: absolute; inset: 0; }
  #bg { background: radial-gradient(ellipse at 50% 30%, #22304d 0%, var(--navy) 70%); }
  #bgBrand { background: url(assets/brand.png) center/cover; filter: blur(40px) brightness(.35) saturate(1.2); transform: scale(1.2); }
  #rays { background: conic-gradient(from 0deg at 50% -10%, transparent 0 40%, rgba(243,220,154,.10) 45%, transparent 50% 100%); mix-blend-mode: screen; }
  .dust { position: absolute; border-radius: 50%; background: var(--gold2); }

  /* intro / outro */
  #brandWrap { overflow: hidden; }
  #brandImg { position: absolute; background: url(assets/brand.png) center/cover; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .bigText { position: absolute; left: 0; right: 0; text-align: center; font-family: Frank; font-weight: 900; color: var(--gold2);
             text-shadow: 0 4px 30px rgba(0,0,0,.8), 0 0 40px rgba(212,175,90,.35); }
  .subText { position: absolute; left: 0; right: 0; text-align: center; font-weight: 400; color: var(--cream); text-shadow: 0 2px 16px rgba(0,0,0,.9); }
  .pill { display: inline-block; padding: .35em 1.1em; border: 2px solid var(--gold); border-radius: 999px; color: var(--gold2);
          background: rgba(16,21,31,.6); font-weight: 700; direction: ltr; }

  /* phone */
  #phone { position: absolute; border-radius: calc(var(--pw) * .11); background: linear-gradient(145deg, #2a2f3a, #0b0d12);
           padding: calc(var(--pw) * .035); box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 2px #3a4152, 0 0 60px rgba(212,175,90,.15); }
  #screen { position: relative; width: 100%; height: 100%; border-radius: calc(var(--pw) * .08); overflow: hidden; background: var(--cream); }
  .shot { position: absolute; inset: 0; }
  .shot .inner { position: absolute; left: 0; width: 100%; }
  .shot img { display: block; width: 100%; }
  .cover { position: absolute; display: flex; align-items: center; justify-content: center; font-family: Heebo; font-weight: 700; color: #1d2433; }
  .hl { position: absolute; border: 4px solid var(--gold); border-radius: 22px;
        box-shadow: 0 0 0 9999px rgba(8,11,18,.55), 0 0 30px 6px rgba(243,220,154,.75), inset 0 0 20px rgba(243,220,154,.35); }

  /* captions */
  .cap { position: absolute; }
  .capTitle { font-family: Frank; font-weight: 900; color: var(--gold2); text-shadow: 0 3px 20px rgba(0,0,0,.8); line-height: 1.1; }
  .capText { font-weight: 700; color: var(--cream); line-height: 1.3; text-shadow: 0 2px 12px rgba(0,0,0,.9); }
  .bullets { list-style: none; }
  .bullets li { font-weight: 700; line-height: 1.35; padding: .35em .8em; margin-bottom: .45em; border-radius: 14px; border-right: 6px solid transparent; }
  .num { display: inline-block; width: 1.6em; height: 1.6em; line-height: 1.6em; text-align: center; border-radius: 50%; background: var(--gold); color: var(--navy); font-weight: 800; margin-left: .5em; font-size: .8em; vertical-align: middle; }
  #fade { background: #000; pointer-events: none; }
  #brandBar { position: absolute; display: flex; align-items: center; gap: 14px; font-family: Frank; font-weight: 900; color: var(--gold2); }
  #brandBar i { display: block; background: url(assets/brand.png) center 58%/cover; border-radius: 12px; border: 2px solid var(--gold); }
</style>
</head>
<body>
<div id="bg" class="layer"></div>
<div id="bgBrand" class="layer"></div>
<div id="rays" class="layer"></div>
<div id="dustLayer" class="layer"></div>

<div id="stage" class="layer">
  <div id="phone"><div id="screen"></div></div>
  <div id="capWrap" class="cap"></div>
  <div id="brandBar"><i></i><span>70 פנים לתורה</span></div>
</div>

<div id="brandWrap" class="layer">
  <div id="brandImg"></div>
  <div id="introShade" class="layer" style="background:linear-gradient(to top, rgba(8,11,18,.92) 0%, rgba(8,11,18,.6) 20%, transparent 38%)"></div>
  <div id="introT1" class="bigText"></div>
  <div id="introT2" class="subText"></div>
</div>

<div id="outro" class="layer">
  <div id="outroImg" style="position:absolute;background:url(assets/brand.png) center/cover;box-shadow:0 30px 80px rgba(0,0,0,.6);border:3px solid var(--gold)"></div>
  <div id="outroT1" class="bigText">70 פנים לתורה</div>
  <div id="outroT2" class="subText">פרשה · מפרשים · סידור · זמני היום · לימוד יומי</div>
  <div id="outroT3" class="subText"><span class="pill">70panimlatorah.expo.app</span></div>
  <div id="outroT4" class="subText" style="font-weight:800;color:var(--gold2)">האפליקציה חינמית – הצטרפו עכשיו!</div>
</div>
<div id="fade" class="layer"></div>

<script>
const P = new URLSearchParams(location.search);
const FORMAT = P.get('format') || 'vertical';
const V = FORMAT === 'vertical';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
document.documentElement.style.setProperty('--W', W + 'px');
document.documentElement.style.setProperty('--H', H + 'px');

// ---- screenshot geometry (fractions of the 1080x2340 image) ----
const IMG_AR = 2340 / 1080;
const CROP_TOP = 0.041, CROP_BOT = 0.933;          // hide Android status bar + nav bar
const VIS = CROP_BOT - CROP_TOP;
// box = [x0, y0, x1, y1] as fractions of the full image (measured on 923x2000 preview)
const b = (x0, y0, x1, y1) => [x0 / 923, y0 / 2000, x1 / 923, y1 / 2000];

const SCREENS = {
  home:   { src: 'assets/home.jpg',   cover: { box: b(0, 88, 923, 165), shade: false } },
  zmanim: { src: 'assets/zmanim.jpg', cover: { box: b(0, 88, 923, 165), shade: true } },
  verse:  { src: 'assets/verse.jpg' },
  siddur: { src: 'assets/siddur.jpg' },
  siddurMain: { src: 'assets/siddur-main.jpg' },
  homeMore: { src: 'assets/home-more.jpg' },
};

// ---- storyboard ----
const SCENES = [
  { screen: 'home', title: 'מסך הבית', steps: [
    { box: b(330, 270, 895, 460), text: 'שעון חי ותאריך עברי מדויק' },
    { box: b(20, 530, 903, 600), text: 'חגים ומועדים – במבט אחד' },
    { box: b(80, 655, 850, 835), text: 'פרשת השבוע וההפטרה' },
    { box: b(18, 848, 905, 1470), text: 'פסוק יומי – ולחיצה אחת ללימוד' },
    { box: b(22, 1488, 905, 1685), text: 'הדלקת נרות וצאת השבת לפי העיר שלך' },
  ]},
  { screen: 'homeMore', title: 'עוד במסך הבית', steps: [
    { box: b(20, 365, 908, 605), text: 'צאת שבת לר״ת ובחירת העיר שלך' },
    { box: b(12, 620, 911, 918), text: 'חוקת יומא ורמב״ם היומי' },
    { box: b(12, 930, 911, 1228), text: 'הדף היומי ותהילים יומי' },
    { box: b(14, 1238, 909, 1674), text: 'מחשבה יומית מספרי המוסר' },
  ]},
  { screen: 'zmanim', title: 'זמני היום', steps: [
    { box: b(50, 300, 873, 600), text: 'כל זמני היום ההלכתיים – לפי העיר שלך' },
    { box: b(85, 640, 838, 1440), text: 'מעלות השחר ועד סוף זמן תפילה' },
    { box: b(100, 800, 250, 1080), text: 'הפעילו התראה לכל זמן שחשוב לכם' },
  ]},
  { screen: 'verse', title: 'לימוד הפסוק', steps: [
    { box: b(30, 262, 893, 555), text: 'כל פסוק בתורה – בניקוד מלא' },
    { box: b(30, 580, 893, 690), text: 'מאות מקורות קשורים לכל פסוק' },
    { box: b(30, 722, 300, 858), text: 'בחרו מתוך מפרשים' },
    { box: b(30, 885, 893, 1660), text: 'פירושים מלאים לקריאה נוחה' },
    { box: b(320, 722, 893, 858), text: 'הוסיפו חידוש או שאילתא משלכם' },
    { box: b(30, 1660, 893, 1835), text: 'כתבו או הקליטו את החידוש בקול' },
  ]},
  { screen: 'siddurMain', title: 'הסידור שלי', steps: [
    { box: b(36, 326, 887, 972), text: 'תפילת חול – נוסח עדות המזרח ונוסח אשכנז' },
    { box: b(36, 1004, 887, 1324), text: 'תפילות וברכות נוספות' },
    { box: b(36, 1344, 887, 1664), text: 'וגם קיצור שולחן ערוך' },
  ]},
  { screen: 'siddur', title: 'קיצור שולחן ערוך', steps: [
    { box: b(90, 125, 835, 250), text: 'ההלכה היומיומית – תמיד איתכם' },
    { box: b(35, 262, 888, 372), text: 'חיפוש מהיר בכל הספר' },
    { box: b(35, 600, 888, 1695), text: 'כל הסימנים מסודרים לפי נושאים' },
  ]},
  { screen: 'home', title: 'ניווט פשוט', steps: [
    { box: b(34, 1698, 890, 1862), text: 'כל האזורים – בלחיצה אחת מסרגל הניווט' },
  ]},
];

const STEP = V ? 1.7 : 2.3;          // seconds per highlight
const SCENE_PAD = V ? 0.9 : 1.3;     // time on scene before first highlight
const INTRO = V ? 5.5 : 6.5, OUTRO = V ? 6.0 : 7.0, XF = 0.7;

let t0 = INTRO;
for (const s of SCENES) { s.start = t0; s.dur = SCENE_PAD + s.steps.length * STEP + 0.4; t0 += s.dur; }
const TOTAL = t0 + OUTRO;
window.TOTAL = TOTAL;

// ---- layout ----
let PW, PH, PX, PY, SW, SH;
if (V) { SW = 650; } else { SW = 450; }
SH = SW * IMG_AR * VIS;
PW = SW * 1.07; PH = SH + SW * 0.07;
if (V) { PX = (W - PW) / 2; PY = 375; } else { PX = W - PW - 190; PY = (H - PH) / 2 + 10; }
const phone = document.getElementById('phone');
Object.assign(phone.style, { left: PX + 'px', top: PY + 'px', width: PW + 'px', height: PH + 'px' });
phone.style.setProperty('--pw', PW + 'px');
const screenEl = document.getElementById('screen');

// captions container
const capWrap = document.getElementById('capWrap');
if (V) {
  Object.assign(capWrap.style, { left: '60px', right: '60px', top: '95px', height: '260px', textAlign: 'center' });
  capWrap.innerHTML = '<div class="capTitle" id="cTitle" style="font-size:84px"></div><div class="capText" id="cText" style="font-size:50px;margin-top:22px"></div>';
} else {
  Object.assign(capWrap.style, { right: (W - PX + 110) + 'px', left: '110px', top: '170px' });
  capWrap.innerHTML = '<div class="capTitle" id="cTitle" style="font-size:96px;margin-bottom:46px"></div><ul class="bullets" id="cList" style="font-size:40px"></ul>';
}
const bar = document.getElementById('brandBar');
if (V) Object.assign(bar.style, { left: '50%', transform: 'translateX(-50%)', bottom: '70px', fontSize: '44px' });
else Object.assign(bar.style, { left: '110px', bottom: '70px', fontSize: '40px' });
bar.querySelector('i').style.cssText += V ? 'width:64px;height:64px' : 'width:58px;height:58px';

// build screen layers
const shotEls = {};
for (const [k, s] of Object.entries(SCREENS)) {
  const el = document.createElement('div'); el.className = 'shot';
  const inner = document.createElement('div'); inner.className = 'inner';
  const imgH = SW * IMG_AR;
  inner.style.height = imgH + 'px'; inner.style.top = (-CROP_TOP * imgH) + 'px';
  inner.innerHTML = `<img src="${s.src}">`;
  if (s.cover) {
    const [x0, y0, x1, y1] = s.cover.box;
    const c = document.createElement('div'); c.className = 'cover';
    Object.assign(c.style, { left: x0 * 100 + '%', top: y0 * 100 + '%', width: (x1 - x0) * 100 + '%', height: (y1 - y0) * 100 + '%',
                             fontSize: SW * 0.058 + 'px' });
    c.textContent = 'שלום, משתמש יקר 👋';
    c.dataset.shade = s.cover.shade ? 1 : 0;
    inner.appendChild(c);
  }
  const hl = document.createElement('div'); hl.className = 'hl'; inner.appendChild(hl);
  el.appendChild(inner); screenEl.appendChild(el);
  shotEls[k] = { el, inner, hl };
}

// sample a background colour from the screenshot to paint the name cover
function sampleCovers() {
  for (const [k, s] of Object.entries(SCREENS)) {
    if (!s.cover) continue;
    const img = shotEls[k].inner.querySelector('img');
    const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
    const y = Math.round(s.cover.box[1] * cv.height + 6);
    const d = cx.getImageData(20, y, 1, 1).data;
    const c = shotEls[k].inner.querySelector('.cover');
    c.style.background = `rgb(${d[0]},${d[1]},${d[2]})`;
    if (s.cover.shade) { c.style.color = 'rgba(29,36,51,.55)'; }
  }
}

// dust particles (deterministic)
const dust = [];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const dl = document.getElementById('dustLayer');
for (let i = 0; i < 40; i++) {
  const d = document.createElement('div'); d.className = 'dust';
  const r = 2 + rnd() * 4; d.style.width = d.style.height = r + 'px';
  dl.appendChild(d);
  dust.push({ d, x: rnd() * W, y: rnd() * H, v: 8 + rnd() * 20, ph: rnd() * 6.28, a: .15 + rnd() * .4 });
}

// ---- helpers ----
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const $ = id => document.getElementById(id);

// intro / outro layout
const introImgH = V ? H : H * 0.86, introImgW = introImgH * 941 / 1672;
function setIntro(t) {
  const wrap = $('brandWrap');
  const out = clamp((t - (INTRO - XF)) / XF);
  wrap.style.opacity = 1 - out;
  const img = $('brandImg');
  const k = 1 + 0.07 * (t / INTRO);
  if (V) {
    Object.assign(img.style, { left: 0, top: 0, width: W + 'px', height: H + 'px', transform: `scale(${k})`, boxShadow: 'none' });
    $('introT1').style.cssText += `;top:${H * 0.815}px;font-size:66px;opacity:${eOut((t - 1.4) / .8)};transform:translateY(${(1 - eOut((t - 1.4) / .8)) * 30}px)`;
    $('introT1').textContent = 'לימוד תורה יומי';
    $('introT2').style.cssText += `;top:${H * 0.815 + 92}px;font-size:44px;font-weight:700;opacity:${eOut((t - 2.2) / .8)}`;
    $('introT2').textContent = 'הכול במקום אחד – ובחינם';
  } else {
    Object.assign(img.style, { left: (W - introImgW - 220) + 'px', top: (H - introImgH) / 2 + 'px', width: introImgW + 'px', height: introImgH + 'px',
      transform: `scale(${k})`, borderRadius: '24px', border: '3px solid #D4AF5A' });
    const a1 = eOut((t - .8) / .9), a2 = eOut((t - 1.8) / .9);
    $('introT1').style.cssText += `;right:${introImgW + 330}px;left:120px;text-align:center;top:390px;font-size:110px;opacity:${a1};transform:translateY(${(1 - a1) * 30}px)`;
    $('introT1').innerHTML = 'לימוד תורה יומי';
    $('introT2').style.cssText += `;right:${introImgW + 330}px;left:120px;text-align:center;top:550px;font-size:50px;font-weight:700;opacity:${a2}`;
    $('introT2').textContent = 'הכול במקום אחד – ובחינם';
  }
  wrap.style.display = out >= 1 ? 'none' : 'block';
}

function setOutro(t) {
  const o = $('outro'); const ts = t - (TOTAL - OUTRO);
  o.style.display = ts < -XF ? 'none' : 'block';
  o.style.opacity = eOut((ts + XF) / XF);
  const img = $('outroImg');
  const ih = V ? 820 : 560, iw = ih * 941 / 1672;
  const pop = eOut((ts) / 1.0);
  Object.assign(img.style, { width: iw + 'px', height: ih + 'px', borderRadius: '26px',
    left: V ? (W - iw) / 2 + 'px' : (W - iw - 260) + 'px', top: V ? '170px' : (H - ih) / 2 + 'px',
    transform: `scale(${0.85 + 0.15 * pop})`, opacity: pop });
  const tx = V ? '' : `;right:${iw + 380}px;left:120px`;
  const base = V ? 170 + ih + 90 : 300;
  const set = (id, top, fs, d) => { const a = eOut((ts - d) / .7); $(id).style.cssText += `${tx};top:${top}px;font-size:${fs}px;opacity:${a};transform:translateY(${(1 - a) * 24}px)`; };
  set('outroT1', base, V ? 104 : 118, .4);
  set('outroT2', base + (V ? 150 : 170), V ? 38 : 42, 1.0);
  set('outroT3', base + (V ? 240 : 270), V ? 46 : 48, 1.5);
  set('outroT4', base + (V ? 350 : 380), V ? 50 : 52, 2.0);
}

function sceneAt(t) { for (const s of SCENES) if (t >= s.start && t < s.start + s.dur) return s; return null; }

let lastScene = null, lastStep = -2;
function setStage(t) {
  const st = $('stage');
  const inA = eOut((t - (INTRO - XF)) / XF);
  st.style.opacity = t < TOTAL - OUTRO ? inA : 1 - eOut((t - (TOTAL - OUTRO)) / XF);
  const s = sceneAt(clamp(t, SCENES[0].start, SCENES[SCENES.length - 1].start + SCENES[SCENES.length - 1].dur - 1e-3));
  const si = SCENES.indexOf(s);
  const lt = t - s.start;
  // screen cross-fade
  for (const [k, e] of Object.entries(shotEls)) e.el.style.opacity = 0;
  const prev = si > 0 ? SCENES[si - 1] : null;
  const xk = clamp(lt / 0.6);
  if (prev && prev.screen !== s.screen && xk < 1) { shotEls[prev.screen].el.style.opacity = 1; shotEls[s.screen].el.style.opacity = ease(xk); }
  else shotEls[s.screen].el.style.opacity = 1;
  // phone gentle entrance + float
  const enter = eOut((t - (INTRO - XF)) / 1.2);
  const fl = Math.sin(t * 0.9) * 6;
  phone.style.transform = `translateY(${(1 - enter) * 120 + fl}px) rotate(${Math.sin(t * .5) * .4}deg)`;

  // highlight
  const si2 = Math.floor((lt - SCENE_PAD) / STEP);
  const step = si2 >= 0 && si2 < s.steps.length ? si2 : (si2 >= s.steps.length ? s.steps.length - 1 : -1);
  const e = shotEls[s.screen];
  for (const k in shotEls) if (k !== s.screen) shotEls[k].hl.style.opacity = 0;
  if (step >= 0) {
    const sl = lt - SCENE_PAD - step * STEP;
    const cur = s.steps[step].box, prv = step > 0 ? s.steps[step - 1].box : null;
    const m = prv ? ease(sl / .45) : 1;
    const bx = prv ? cur.map((v, i) => lerp(prv[i], v, m)) : cur;
    Object.assign(e.hl.style, { left: bx[0] * 100 + '%', top: bx[1] * 100 + '%', width: (bx[2] - bx[0]) * 100 + '%', height: (bx[3] - bx[1]) * 100 + '%' });
    let a = step === 0 ? eOut(sl / .45) : 1;
    const endFade = clamp((s.dur - lt) / 0.4);
    const pulse = 0.85 + 0.15 * Math.sin(t * 5);
    e.hl.style.opacity = a * endFade;
    e.hl.style.borderColor = `rgba(212,175,90,${pulse})`;
  } else e.hl.style.opacity = 0;

  // captions
  const ta = eOut(lt / .5) * clamp((s.dur - lt) / .35);
  $('cTitle').textContent = s.title;
  $('cTitle').style.opacity = ta;
  $('cTitle').style.transform = `translateY(${(1 - eOut(lt / .5)) * -20}px)`;
  if (V) {
    const txt = step >= 0 ? s.steps[step].text : '';
    const sl = step >= 0 ? lt - SCENE_PAD - step * STEP : 0;
    const a = step >= 0 ? eOut(sl / .35) * clamp((s.dur - lt) / .35) : 0;
    $('cText').textContent = txt; $('cText').style.opacity = a;
    $('cText').style.transform = `translateY(${(1 - eOut(sl / .35)) * 18}px)`;
  } else {
    const ul = $('cList');
    if (lastScene !== s) {
      ul.innerHTML = s.steps.map((x, i) => `<li><span class="num">${i + 1}</span>${x.text}</li>`).join('');
      lastScene = s;
    }
    [...ul.children].forEach((li, i) => {
      const appear = eOut((lt - SCENE_PAD - i * STEP + .3) / .45);
      const active = i === step;
      li.style.opacity = appear * (active ? 1 : .55) * clamp((s.dur - lt) / .35);
      li.style.transform = `translateX(${(1 - appear) * -40}px)`;
      li.style.background = active ? 'rgba(212,175,90,.14)' : 'transparent';
      li.style.borderRightColor = active ? 'var(--gold)' : 'transparent';
      li.style.color = active ? 'var(--gold2)' : 'var(--cream)';
    });
  }
}

window.setTime = function (t) {
  $('rays').style.transform = `rotate(${Math.sin(t * .15) * 6}deg)`;
  $('bgBrand').style.opacity = 0.9;
  for (const p of dust) {
    const y = ((p.y - p.v * t) % H + H) % H;
    p.d.style.transform = `translate(${p.x + Math.sin(t * .6 + p.ph) * 20}px, ${y}px)`;
    p.d.style.opacity = p.a * (0.6 + 0.4 * Math.sin(t * 1.3 + p.ph));
  }
  setIntro(t);
  setStage(t);
  setOutro(t);
  const f = $('fade');
  f.style.opacity = Math.max(1 - eOut(t / 0.6), eOut((t - (TOTAL - 0.7)) / 0.7));
};

window.ready = (async () => {
  await Promise.all(['400 20px Heebo', '700 20px Heebo', '800 20px Heebo', '500 20px Frank', '700 20px Frank', '900 20px Frank']
    .map(f => document.fonts.load(f, 'שלום')));
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode()));
  sampleCovers();
  window.setTime(0);
  return TOTAL;
})();
</script>
</body>
