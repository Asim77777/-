<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>70 פנים לתורה – סרטון</title>
<style>
  @font-face { font-family: Heebo; font-weight: 400; src: url(fonts/heebo-hebrew-400-normal.woff2); }
  @font-face { font-family: Heebo; font-weight: 700; src: url(fonts/heebo-hebrew-700-normal.woff2); }
  @font-face { font-family: Heebo; font-weight: 800; src: url(fonts/heebo-hebrew-800-normal.woff2); }
  @font-face { font-family: Frank; font-weight: 500; src: url(fonts/frank-ruhl-libre-hebrew-500-normal.woff2); }
  @font-face { font-family: Frank; font-weight: 700; src: url(fonts/frank-ruhl-libre-hebrew-700-normal.woff2); }
  @font-face { font-family: Frank; font-weight: 900; src: url(fonts/frank-ruhl-libre-hebrew-900-normal.woff2); }

  :root { --ink: #0C111D; --gold: #C9A24A; --gold2: #EBD28E; --cream: #F2EBDC; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W, 1920px); height: var(--H, 1080px); overflow: hidden; background: #000; }
  body { font-family: Heebo, sans-serif; color: var(--cream); position: relative; }

  .frame { position: absolute; inset: 0; overflow: hidden; background-color: var(--ink); backface-visibility: hidden; }
  .ground { position: absolute; inset: 0;
    background:
      repeating-linear-gradient(to bottom, transparent 0 53px, rgba(201,162,74,.055) 53px 54px),
      var(--grain),
      radial-gradient(ellipse 70% 80% at var(--lx, 30%) var(--ly, 40%), #1d2740 0%, transparent 70%),
      var(--ink); }
  .margins { position: absolute; inset: 0; pointer-events: none; }
  .margins::before, .margins::after { content: ''; position: absolute; top: 38px; bottom: 38px; width: 5px;
    border-left: 1px solid rgba(201,162,74,.28); border-right: 1px solid rgba(201,162,74,.28); }
  .margins::before { left: 52px; } .margins::after { right: 52px; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .shade { position: absolute; inset: 0; opacity: 0; pointer-events: none; z-index: 20; }

  /* phone */
  .phone { position: absolute; border-radius: 46px; background: #07090e; padding: 14px;
           box-shadow: 0 0 0 1px rgba(201,162,74,.6), 0 0 0 7px #07090e, 0 0 0 8px rgba(201,162,74,.22), 0 50px 90px rgba(0,0,0,.65); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 33px; overflow: hidden; background: var(--cream); }
  .shot { position: absolute; left: 0; width: 100%; }
  .shot img { display: block; width: 100%; }
  .cover { position: absolute; display: flex; align-items: center; justify-content: center; font-family: Heebo; font-weight: 700; color: #1d2433; }
  .hl { position: absolute; opacity: 0; box-shadow: 0 0 0 9999px rgba(8,11,18,.42);
        --c: #D9B864; --l: 16px; --w: 2.5px;
        background:
          linear-gradient(var(--c),var(--c)) top left / var(--l) var(--w) no-repeat, linear-gradient(var(--c),var(--c)) top left / var(--w) var(--l) no-repeat,
          linear-gradient(var(--c),var(--c)) top right / var(--l) var(--w) no-repeat, linear-gradient(var(--c),var(--c)) top right / var(--w) var(--l) no-repeat,
          linear-gradient(var(--c),var(--c)) bottom left / var(--l) var(--w) no-repeat, linear-gradient(var(--c),var(--c)) bottom left / var(--w) var(--l) no-repeat,
          linear-gradient(var(--c),var(--c)) bottom right / var(--l) var(--w) no-repeat, linear-gradient(var(--c),var(--c)) bottom right / var(--w) var(--l) no-repeat; }

  /* projected detail plate */
  .plate { position: absolute; opacity: 0; background-repeat: no-repeat; border-radius: 4px; background-color: var(--cream);
           box-shadow: 0 0 0 1px var(--gold), 0 0 0 7px rgba(12,17,29,.92), 0 0 0 8px rgba(201,162,74,.35), 0 40px 80px rgba(0,0,0,.6); }
  .plateTag { position: absolute; font: 400 15px Heebo; letter-spacing: .32em; color: var(--gold); direction: ltr; white-space: nowrap; opacity: 0; }
  svg.proj { position: absolute; left: 0; top: 0; width: var(--W, 1920px); height: var(--H, 1080px); pointer-events: none; overflow: visible; }

  /* text column */
  .col { position: absolute; right: 118px; width: 600px; top: 0; bottom: 0; }
  .numeral { position: absolute; right: -30px; top: 30px; font: 900 440px/1 Frank; color: transparent;
             -webkit-text-stroke: 1.4px rgba(201,162,74,.30); }
  .eyebrow { position: absolute; right: 0; top: 262px; font: 400 18px Heebo; letter-spacing: .42em; color: var(--gold); direction: ltr; text-align: right; width: 100%; }
  .title { position: absolute; right: 0; top: 300px; font: 900 96px/1.05 Frank; color: var(--gold2); white-space: nowrap; }
  .ticks { position: absolute; right: 0; top: 440px; width: 600px; height: 16px; }
  .ticks i { position: absolute; inset: 0; display: block;
    background:
      repeating-linear-gradient(to left, currentColor 0 1px, transparent 1px 8.571px) bottom / 100% 8px no-repeat,
      repeating-linear-gradient(to left, currentColor 0 1px, transparent 1px 85.71px) bottom / 100% 16px no-repeat; }
  .ticks .base { color: rgba(201,162,74,.28); }
  .ticks .fill { color: var(--gold2); }
  .step { position: absolute; right: 0; top: 500px; width: 600px; font: 500 52px/1.28 Frank; color: var(--cream); }
  .idx { position: absolute; right: 0; top: 720px; font: 400 20px Heebo; letter-spacing: .38em; color: var(--gold); direction: ltr; text-align: right; width: 100%; }
  .brandMark { position: absolute; left: 110px; bottom: 58px; display: flex; align-items: baseline; gap: 18px;
               font: 400 17px Heebo; letter-spacing: .3em; color: rgba(235,210,142,.7); }
  .brandMark b { font: 900 30px Frank; letter-spacing: 0; color: var(--gold2); }

  /* intro / outro */
  .arch { position: absolute; background: url(assets/brand.png) center 42%/cover; border-radius: 999px 999px 10px 10px / 330px 330px 10px 10px;
          box-shadow: 0 0 0 1px var(--gold), 0 0 0 10px rgba(12,17,29,.95), 0 0 0 11px rgba(201,162,74,.4), 0 50px 100px rgba(0,0,0,.7); }
  .seal { position: absolute; width: 190px; height: 190px; }
  .seal svg { width: 100%; height: 100%; overflow: visible; }
  .bigT { position: absolute; font: 900 124px/1.05 Frank; color: var(--gold2); white-space: nowrap; }
  .subT { position: absolute; font: 400 40px/1.4 Heebo; color: var(--cream); white-space: nowrap; }
  .url { position: absolute; font: 400 30px Heebo; letter-spacing: .12em; color: var(--gold2); direction: ltr; white-space: nowrap;
         padding: 14px 34px; box-shadow: inset 0 0 0 1px var(--gold), 0 0 0 5px rgba(12,17,29,1), 0 0 0 6px rgba(201,162,74,.3); border-radius: 2px; }
  #fx { position: absolute; left: 0; top: 0; width: var(--W, 1920px); height: var(--H, 1080px); pointer-events: none; z-index: 50; }
  #roller { position: absolute; top: -20px; bottom: -20px; width: 86px; z-index: 60; display: none;
    background: linear-gradient(to right, #1a1206 0%, #5a4118 14%, #c9a24a 34%, #f6e3a8 46%, #c9a24a 58%, #6b4d1c 80%, #1a1206 100%);
    box-shadow: -30px 0 60px rgba(0,0,0,.6), 30px 0 60px rgba(0,0,0,.35); }
  /* 9:16 layout: text on top, magnified plate below it, phone at the bottom */
  body.v .col { right: 90px; width: 900px; }
  body.v .numeral { right: -20px; top: 40px; font-size: 360px; }
  body.v .eyebrow { top: 150px; }
  body.v .title { top: 186px; font-size: 100px; }
  body.v .ticks { top: 322px; width: 900px; }
  body.v .step { top: 372px; width: 900px; font-size: 56px; }
  body.v .idx { top: 520px; }
  body.v .brandMark { left: 0; right: 0; bottom: auto; top: 62px; justify-content: center; }
  body.v .margins::before, body.v .margins::after { top: 30px; bottom: 30px; }
  body.v .margins::before { left: 34px; } body.v .margins::after { right: 34px; }
  #black { position: absolute; inset: 0; background: #000; z-index: 90; pointer-events: none; }
</style>
</head>
<body>
<div id="frames"></div>
<svg id="fx"></svg>
<div id="roller"></div>
<div id="black"></div>

<script>
const V = new URLSearchParams(location.search).get('format') === 'vertical';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, NS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const eIO = x => { x = clamp(x); return -(Math.cos(Math.PI * x) - 1) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };

document.documentElement.style.setProperty('--W', W + 'px');
document.documentElement.style.setProperty('--H', H + 'px');
if (V) document.body.classList.add('v');

// paper grain as a cached SVG image
const grainSvg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .7  0 0 0 0 .45  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>`;
document.documentElement.style.setProperty('--grain', `url("data:image/svg+xml,${encodeURIComponent(grainSvg)}")`);

// ---------- screenshot geometry ----------
const IMG_AR = 2340 / 1080, CROP_TOP = 0.041, CROP_BOT = 0.933, VIS = CROP_BOT - CROP_TOP;
const b = (x0, y0, x1, y1) => [x0 / 923, y0 / 2000, x1 / 923, y1 / 2000];
const SCREENS = {
  home:       { src: 'assets/home.jpg', cover: b(0, 88, 923, 165) },
  homeMore:   { src: 'assets/home-more.jpg' },
  zmanim:     { src: 'assets/zmanim.jpg', cover: b(0, 88, 923, 165), shade: true },
  verse:      { src: 'assets/verse.jpg' },
  siddurMain: { src: 'assets/siddur-main.jpg' },
};

const SCENES = [
  { screen: 'home', title: 'מסך הבית', num: 'א', trans: 'roll', light: ['28%', '35%'], steps: [
    { box: b(330, 270, 895, 460), text: 'שעון חי ותאריך עברי מדויק' },
    { box: b(20, 530, 903, 600), text: 'חגים ומועדים – במבט אחד' },
    { box: b(80, 655, 850, 835), text: 'פרשת השבוע וההפטרה' },
    { box: b(18, 848, 905, 1470), text: 'פסוק יומי – ולחיצה אחת ללימוד' },
    { box: b(22, 1488, 905, 1685), text: 'הדלקת נרות וצאת השבת לפי העיר שלך' },
  ]},
  { screen: 'homeMore', title: 'עוד במסך הבית', num: 'ב', trans: 'ink', light: ['22%', '60%'], steps: [
    { box: b(20, 365, 908, 605), text: 'צאת שבת לר״ת ובחירת העיר שלך' },
    { box: b(12, 620, 911, 918), text: 'חוקת יומא ורמב״ם היומי' },
    { box: b(12, 930, 911, 1228), text: 'הדף היומי ותהילים יומי' },
    { box: b(14, 1238, 909, 1674), text: 'מחשבה יומית מספרי המוסר' },
  ]},
  { screen: 'zmanim', title: 'זמני היום', num: 'ג', trans: 'page', light: ['35%', '30%'], steps: [
    { box: b(50, 300, 873, 600), text: 'כל זמני היום ההלכתיים – לפי העיר שלך' },
    { box: b(85, 640, 838, 1440), text: 'מעלות השחר ועד סוף זמן תפילה' },
    { box: b(100, 800, 250, 1080), text: 'הפעילו התראה לכל זמן שחשוב לכם' },
  ]},
  { screen: 'verse', title: 'לימוד הפסוק', num: 'ד', trans: 'strips', light: ['25%', '45%'], steps: [
    { box: b(30, 262, 893, 555), text: 'כל פסוק בתורה – בניקוד מלא' },
    { box: b(30, 580, 893, 690), text: 'מאות מקורות קשורים לכל פסוק' },
    { box: b(30, 722, 300, 858), text: 'בחרו מתוך מפרשים' },
    { box: b(30, 885, 893, 1660), text: 'פירושים מלאים לקריאה נוחה' },
    { box: b(320, 722, 893, 858), text: 'הוסיפו חידוש או שאילתא משלכם' },
    { box: b(30, 1660, 893, 1835), text: 'כתבו או הקליטו את החידוש בקול' },
  ]},
  { screen: 'siddurMain', title: 'הסידור שלי', num: 'ה', trans: 'roll', light: ['30%', '55%'], steps: [
    { box: b(36, 326, 887, 972), text: 'תפילת חול – נוסח עדות המזרח ונוסח אשכנז' },
    { box: b(36, 1004, 887, 1324), text: 'תפילות וברכות נוספות' },
    { box: b(36, 1344, 887, 1664), text: 'קיצור שולחן ערוך – תמיד איתכם' },
  ]},
  { screen: 'home', title: 'ניווט פשוט', num: 'ו', trans: 'ink', light: ['26%', '70%'], steps: [
    { box: b(34, 1698, 890, 1862), text: 'כל האזורים – בלחיצה אחת מסרגל הניווט' },
  ]},
];

// ---------- timing ----------
const TD = 1.15, PAD = 1.7, STEP = 2.35, TAIL = 0.35, INTRO = 7.2, OUTRO = 7.6;
const FRAMES = [{ kind: 'intro', start: 0, dur: INTRO }];
let t0 = INTRO;
for (const s of SCENES) { const f = { kind: 'scene', s, start: t0, dur: PAD + s.steps.length * STEP + TAIL, trans: s.trans }; FRAMES.push(f); t0 += f.dur; }
FRAMES.push({ kind: 'outro', start: t0, dur: OUTRO, trans: 'strips' }); t0 += OUTRO;
const TOTAL = t0;
window.TOTAL = TOTAL;
window.TRANSITIONS = FRAMES.slice(1).map(f => f.start);

// ---------- layout ----------
const SW = V ? 456 : 400, IMGH = SW * IMG_AR, SH = IMGH * VIS, BZ = 14;
const PW = SW + 2 * BZ, PH = SH + 2 * BZ, PX = V ? (W - PW) / 2 : 150, PY = V ? H - PH - 52 : (H - PH) / 2;
const SX = PX + BZ, SY = PY + BZ;
const PLATE_CX = V ? W / 2 : 900, PLATE_MAXW = V ? 880 : 480, PLATE_MAXH = V ? 300 : 420;
const PLATE_CY = 755;  // vertical only: centre of the plate band between caption and phone

function boxRect(bx) {
  return { x: SX + bx[0] * SW, y: SY + (bx[1] - CROP_TOP) * IMGH, w: (bx[2] - bx[0]) * SW, h: (bx[3] - bx[1]) * IMGH };
}

// ---------- build ----------
const root = $('#frames');
function makeFrame() {
  const f = el('div', 'frame', root);
  el('div', 'ground', f); el('div', 'margins', f); el('div', 'vignette', f);
  return f;
}
function svgIn(parent) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'proj'); parent.appendChild(s); return s; }
function sAdd(svg, tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }

for (const F of FRAMES) {
  if (F.kind !== 'scene') continue;
  const s = F.s, scr = SCREENS[s.screen];
  const f = F.el = makeFrame();
  f.style.setProperty('--lx', s.light[0]); f.style.setProperty('--ly', s.light[1]);
  const phone = el('div', 'phone', f);
  Object.assign(phone.style, { left: PX + 'px', top: PY + 'px', width: PW + 'px', height: PH + 'px' });
  const screen = el('div', 'screen', phone);
  const shot = el('div', 'shot', screen, `<img src="${scr.src}">`);
  shot.style.height = IMGH + 'px'; shot.style.top = (-CROP_TOP * IMGH) + 'px';
  if (scr.cover) {
    const [x0, y0, x1, y1] = scr.cover;
    const c = el('div', 'cover', shot, 'שלום, משתמש יקר 👋');
    Object.assign(c.style, { left: x0 * 100 + '%', top: y0 * 100 + '%', width: (x1 - x0) * 100 + '%', height: (y1 - y0) * 100 + '%', fontSize: SW * .058 + 'px' });
    c.dataset.y = y0; c.dataset.shade = scr.shade ? 1 : 0;
  }
  F.hl = el('div', 'hl', shot);
  const proj = svgIn(f);
  F.lines = [0, 1].map(() => sAdd(proj, 'line', { stroke: '#C9A24A', 'stroke-width': 1 }));
  F.dots = [0, 1, 2, 3].map(() => sAdd(proj, 'circle', { r: 3.2, fill: '#0C111D', stroke: '#EBD28E', 'stroke-width': 1.2 }));
  F.plate = el('div', 'plate', f); F.plate.style.backgroundImage = `url(${scr.src})`;
  F.tag = el('div', 'plateTag', f);
  const col = el('div', 'col', f);
  el('div', 'numeral', col, s.num);
  const n = SCENES.indexOf(s) + 1;
  el('div', 'eyebrow', col, `0${n} &nbsp;/&nbsp; 0${SCENES.length}`);
  el('div', 'title', col, s.title);
  const ticks = el('div', 'ticks', col); el('i', 'base', ticks); F.fill = el('i', 'fill', ticks);
  F.stepPrev = el('div', 'step', col); F.stepCur = el('div', 'step', col);
  F.idx = el('div', 'idx', col);
  el('div', 'brandMark', f, '<b>70 פנים לתורה</b><span>לימוד תורה יומי</span>');
  F.shade = el('div', 'shade', f);
}

function sealSVG(word) {
  let dots = '';
  for (let i = 0; i < 70; i++) {
    const a = i / 70 * Math.PI * 2 - Math.PI / 2, r = 84;
    dots += `<circle cx="${(95 + r * Math.cos(a)).toFixed(2)}" cy="${(95 + r * Math.sin(a)).toFixed(2)}" r="${i % 10 === 0 ? 2.4 : 1.1}" fill="#C9A24A"/>`;
  }
  return `<svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="94" fill="#0C111D" stroke="#C9A24A" stroke-width="1"/>
    <circle cx="95" cy="95" r="74" fill="none" stroke="rgba(201,162,74,.5)" stroke-width="1"/>${dots}
    <text x="95" y="111" text-anchor="middle" font-family="Frank" font-weight="900" font-size="50" fill="#EBD28E">${word}</text></svg>`;
}

// intro
const FI = FRAMES[0];
{
  const f = FI.el = makeFrame();
  f.style.setProperty('--lx', '50%'); f.style.setProperty('--ly', '50%');
  const svg = svgIn(f);
  FI.rays = [];
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) {
    const l = sAdd(svg, 'line', { stroke: '#C9A24A', 'stroke-width': i % 10 === 0 ? 1.6 : .9 });
    FI.rays.push({ l, a: i / 70 * Math.PI * 2 - Math.PI / 2, len: 150 + rnd() * 190 + (i % 10 === 0 ? 90 : 0) });
  }
  FI.ayin = el('div', null, f, '<div style="font:900 170px/1 Frank;color:transparent;-webkit-text-stroke:1.8px #EBD28E">70</div><div style="font:900 78px/1.1 Frank;color:#EBD28E;margin-top:14px">פנים לתורה</div>');
  Object.assign(FI.ayin.style, { position: 'absolute', left: 0, width: W + 'px', top: (H / 2 - 150) + 'px', height: '300px', textAlign: 'center' });
  FI.arch = el('div', 'arch', f);
  FI.t1 = el('div', 'bigT', f, 'לימוד תורה יומי');
  FI.rule = el('div', 'ticks', f); el('i', 'base', FI.rule); FI.ruleFill = el('i', 'fill', FI.rule);
  FI.t2 = el('div', 'subT', f, 'הכול במקום אחד – ובחינם');
  FI.seal = el('div', 'seal', f, sealSVG('חינם'));
  FI.shade = el('div', 'shade', f);
}

// outro
const FO = FRAMES[FRAMES.length - 1];
{
  const f = FO.el = makeFrame();
  f.style.setProperty('--lx', '30%'); f.style.setProperty('--ly', '45%');
  FO.arch = el('div', 'arch', f);
  FO.t1 = el('div', 'bigT', f, '70 פנים לתורה');
  FO.rule = el('div', 'ticks', f); el('i', 'base', FO.rule); FO.ruleFill = el('i', 'fill', FO.rule);
  FO.t2 = el('div', 'subT', f, 'פרשה · מפרשים · סידור · זמני היום · לימוד יומי');
  FO.url = el('div', 'url', f, 'https://70panimlatorah.expo.app');
  FO.qr = el('div', 'plate', f); FO.qr.style.background = 'url(assets/qr.svg) center/100% no-repeat #F2EBDC';
  FO.qrTag = el('div', 'subT', f, 'סרקו לכניסה');
  FO.t3 = el('div', 'subT', f, 'האפליקציה חינמית – הצטרפו עכשיו');
  FO.seal = el('div', 'seal', f, sealSVG('חינם'));
  FO.shade = el('div', 'shade', f);
}

// ---------- renderers ----------
function renderScene(F, lt) {
  const s = F.s;
  const raw = Math.floor((lt - PAD) / STEP);
  const step = raw < 0 ? -1 : Math.min(raw, s.steps.length - 1);
  const sl = lt - PAD - Math.max(step, 0) * STEP;
  const prog = clamp((lt - PAD * .6) / (s.steps.length * STEP + PAD * .4));
  F.fill.style.clipPath = `inset(0 0 0 ${(1 - prog) * 100}%)`;

  if (step < 0) {
    F.hl.style.opacity = 0; F.plate.style.opacity = 0; F.tag.style.opacity = 0; F.idx.style.opacity = 0;
    F.lines.concat(F.dots).forEach(x => x.setAttribute('opacity', 0));
    F.stepCur.textContent = ''; F.stepPrev.textContent = '';
    return;
  }
  F.idx.textContent = `0${step + 1} — 0${s.steps.length}`;
  F.idx.style.opacity = step === 0 ? eOut(sl / .6) : 1;
  const cur = s.steps[step].box, prv = step > 0 ? s.steps[step - 1].box : null;
  const m = prv ? eIO(sl / .7) : 1;
  const bx = prv ? cur.map((v, i) => lerp(prv[i], v, m)) : cur;
  const appear = step === 0 ? eOut(sl / .8) : 1;

  Object.assign(F.hl.style, { left: bx[0] * 100 + '%', top: bx[1] * 100 + '%', width: (bx[2] - bx[0]) * 100 + '%', height: (bx[3] - bx[1]) * 100 + '%', opacity: appear });

  const r = boxRect(bx);
  const sc = Math.min(PLATE_MAXW / r.w, PLATE_MAXH / r.h, 2.4);
  const pw = r.w * sc, ph = r.h * sc;
  const pcy = V ? PLATE_CY : clamp(r.y + r.h / 2, 150 + ph / 2, H - 150 - ph / 2);
  const tgt = { x: PLATE_CX - pw / 2, y: pcy - ph / 2, w: pw, h: ph };
  const k = step === 0 ? ease(sl / .95) : 1;
  const P = { x: lerp(r.x, tgt.x, k), y: lerp(r.y, tgt.y, k), w: lerp(r.w, tgt.w, k), h: lerp(r.h, tgt.h, k) };
  const s2 = P.w / r.w;
  Object.assign(F.plate.style, { left: P.x + 'px', top: P.y + 'px', width: P.w + 'px', height: P.h + 'px', opacity: appear,
    backgroundSize: `${SW * s2}px ${IMGH * s2}px`, backgroundPosition: `${-bx[0] * SW * s2}px ${-bx[1] * IMGH * s2}px` });
  F.tag.textContent = `FIG. ${String(SCENES.indexOf(s) + 1)}.${step + 1}`;
  Object.assign(F.tag.style, V ? { left: (P.x + P.w + 14) + 'px', top: (P.y - 4) + 'px', opacity: appear * .9, writingMode: 'vertical-rl' }
                               : { left: P.x + 'px', top: (P.y + P.h + 22) + 'px', opacity: appear * .9 });

  const la = appear * .8;
  const pts = V ? [[r.x, r.y, P.x, P.y + P.h], [r.x + r.w, r.y, P.x + P.w, P.y + P.h]]
                : [[r.x + r.w, r.y, P.x, P.y], [r.x + r.w, r.y + r.h, P.x, P.y + P.h]];
  pts.forEach((p, i) => {
    const L = F.lines[i];
    L.setAttribute('x1', p[0]); L.setAttribute('y1', p[1]); L.setAttribute('x2', p[2]); L.setAttribute('y2', p[3]); L.setAttribute('opacity', la);
  });
  [[pts[0][0], pts[0][1]], [pts[1][0], pts[1][1]], [pts[0][2], pts[0][3]], [pts[1][2], pts[1][3]]].forEach((c, i) => {
    F.dots[i].setAttribute('cx', c[0]); F.dots[i].setAttribute('cy', c[1]); F.dots[i].setAttribute('opacity', la);
  });

  const w = eOut(sl / .85);
  F.stepCur.textContent = s.steps[step].text;
  F.stepCur.style.clipPath = `inset(-24px 0 -24px ${(1 - w) * 100}%)`;
  F.stepPrev.textContent = prv ? s.steps[step - 1].text : '';
  const q = eOut(sl / .45);
  F.stepPrev.style.opacity = 1 - q;
  F.stepPrev.style.transform = `translateY(${-28 * q}px)`;
  F.stepPrev.style.filter = `blur(${4 * q}px)`;
}

function renderIntro(F, lt) {
  const cx = W / 2, cy = H / 2;
  const burst = ease((lt - 2.5) / 1.1);
  for (const [i, r] of F.rays.entries()) {
    const d = eOut((lt - 0.25 - i * 0.022) / .7);
    const r0 = 285 + burst * 900, r1 = r0 + r.len * d * (1 - burst * .3);
    const a = r.a + lt * .02;
    r.l.setAttribute('x1', cx + r0 * Math.cos(a)); r.l.setAttribute('y1', cy + r0 * Math.sin(a));
    r.l.setAttribute('x2', cx + r1 * Math.cos(a)); r.l.setAttribute('y2', cy + r1 * Math.sin(a));
    r.l.setAttribute('opacity', (d > 0 ? 1 : 0) * (1 - burst) * .9);
  }
  const ay = eOut((lt - .6) / 1.2);
  F.ayin.style.opacity = ay * (1 - burst);
  F.ayin.style.transform = `scale(${0.92 + .08 * ay + burst * 3})`;

  const a1 = eOut((lt - 3.0) / 1.1), a2 = eOut((lt - 3.6) / 1.0), a3 = eOut((lt - 4.2) / 1.0), a4 = eOut((lt - 4.8) / .9);
  const ah = 800, aw = 500, AX = 220;
  Object.assign(F.arch.style, { left: AX + 'px', top: (H - ah) / 2 + 'px', width: aw + 'px', height: ah + 'px', opacity: a1 > 0 ? 1 : 0,
    clipPath: `inset(${(1 - a1) * 100}% -40px -40px -40px)`, transform: `scale(${1.03 - .03 * a1})` });
  Object.assign(F.t1.style, { right: '170px', top: '330px', opacity: a2 > 0 ? 1 : 0, clipPath: `inset(-40px 0 -40px ${(1 - a2) * 100}%)` });
  Object.assign(F.rule.style, { right: '170px', top: '492px', width: '860px', opacity: a2 });
  F.ruleFill.style.clipPath = `inset(0 0 0 ${(1 - eIO((lt - 3.7) / 2.4)) * 100}%)`;
  Object.assign(F.t2.style, { right: '170px', top: '532px', opacity: a3, transform: `translateY(${(1 - a3) * 20}px)` });
  Object.assign(F.seal.style, { left: (AX + aw - 105) + 'px', top: (H / 2 + ah / 2 - 150) + 'px', opacity: a4,
    transform: `rotate(${(1 - a4) * -40 + lt * 2}deg) scale(${.8 + .2 * a4})` });

  if (V) {
    const ahv = 880, awv = 540, AXv = (W - awv) / 2, Tv = 230;
    Object.assign(F.arch.style, { left: AXv + 'px', top: Tv + 'px', width: awv + 'px', height: ahv + 'px' });
    Object.assign(F.t1.style, { left: '0', right: '0', textAlign: 'center', top: '1210px', fontSize: '112px' });
    Object.assign(F.rule.style, { left: (W - 760) / 2 + 'px', right: 'auto', top: '1372px', width: '760px' });
    Object.assign(F.t2.style, { left: '0', right: '0', textAlign: 'center', top: '1412px', fontSize: '42px' });
    Object.assign(F.seal.style, { left: (AXv + awv - 120) + 'px', top: (Tv + ahv - 150) + 'px' });
  }
}

function renderOutro(F, lt) {
  const a0 = eOut((lt - .3) / 1.2), a1 = eOut((lt - .9) / 1), a2 = eOut((lt - 1.5) / 1), a3 = eOut((lt - 2.1) / 1), a4 = eOut((lt - 2.7) / 1), a5 = eOut((lt - 3.3) / .9);
  const ah = 760, aw = 480, AX = 220, R = '170px';
  Object.assign(F.arch.style, { left: AX + 'px', top: (H - ah) / 2 + 'px', width: aw + 'px', height: ah + 'px', opacity: a0 > 0 ? 1 : 0,
    clipPath: `inset(${(1 - a0) * 100}% -40px -40px -40px)` });
  Object.assign(F.t1.style, { right: R, top: '260px', opacity: a1 > 0 ? 1 : 0, clipPath: `inset(-40px 0 -40px ${(1 - a1) * 100}%)` });
  Object.assign(F.rule.style, { right: R, top: '425px', width: '900px', opacity: a1 });
  F.ruleFill.style.clipPath = `inset(0 0 0 ${(1 - eIO((lt - 1) / 3)) * 100}%)`;
  Object.assign(F.t2.style, { right: R, top: '462px', fontSize: '34px', opacity: a2, transform: `translateY(${(1 - a2) * 18}px)` });
  Object.assign(F.url.style, { right: R, top: '570px', opacity: a3, transform: `translateY(${(1 - a3) * 18}px)` });
  const a6 = eOut((lt - 2.4) / 1);
  Object.assign(F.qr.style, { left: '790px', top: '548px', width: '210px', height: '210px', opacity: a6, clipPath: `inset(0 0 ${(1 - a6) * 100}% 0)` });
  Object.assign(F.qrTag.style, { left: '790px', width: '210px', textAlign: 'center', top: '784px', font: '400 22px Heebo', letterSpacing: '.2em', color: 'var(--gold)', opacity: a6 });
  Object.assign(F.t3.style, { right: R, top: '690px', font: '700 46px/1.4 Heebo', color: 'var(--gold2)', opacity: a4, transform: `translateY(${(1 - a4) * 18}px)` });
  Object.assign(F.seal.style, { left: (AX + aw - 105) + 'px', top: (H / 2 + ah / 2 - 150) + 'px', opacity: a5,
    transform: `rotate(${(1 - a5) * -40 + lt * 2}deg) scale(${.8 + .2 * a5})` });

  if (V) {
    const ahv = 640, awv = 400, AXv = (W - awv) / 2, Tv = 150;
    Object.assign(F.arch.style, { left: AXv + 'px', top: Tv + 'px', width: awv + 'px', height: ahv + 'px' });
    Object.assign(F.seal.style, { left: (AXv + awv - 120) + 'px', top: (Tv + ahv - 150) + 'px' });
    const C = { left: '0', right: '0', textAlign: 'center' };
    Object.assign(F.t1.style, C, { top: '850px', fontSize: '112px' });
    Object.assign(F.rule.style, { left: (W - 820) / 2 + 'px', right: 'auto', top: '1008px', width: '820px' });
    Object.assign(F.t2.style, C, { top: '1044px', fontSize: '32px' });
    Object.assign(F.url.style, { left: '50%', right: 'auto', top: '1136px', transform: `translate(-50%, ${(1 - a3) * 18}px)` });
    Object.assign(F.qr.style, { left: (W - 250) / 2 + 'px', top: '1268px', width: '250px', height: '250px' });
    Object.assign(F.qrTag.style, { left: (W - 250) / 2 + 'px', width: '250px', top: '1536px' });
    Object.assign(F.t3.style, C, { top: '1610px' });
  }
}

function render(F, lt) {
  if (F.kind === 'scene') renderScene(F, lt);
  else if (F.kind === 'intro') renderIntro(F, lt);
  else renderOutro(F, lt);
}

// ---------- transitions ----------
const fx = $('#fx'), roller = $('#roller');
function clearFx() { fx.innerHTML = ''; roller.style.display = 'none'; }
function resetFrame(F) {
  Object.assign(F.el.style, { display: 'none', clipPath: 'none', transform: 'none', zIndex: 0, transformOrigin: '', filter: 'none' });
  F.shade.style.opacity = 0;
}
function lastFocus(F) {
  if (F.kind !== 'scene') return [W / 2, H / 2];
  const r = boxRect(F.s.steps[F.s.steps.length - 1].box);
  return [r.x + r.w / 2, r.y + r.h / 2];
}

function transition(type, out, inc, p, seed) {
  const I = inc.el, O = out.el;
  I.style.zIndex = 2; O.style.zIndex = 1;
  if (type === 'roll') {
    // a gilded roller sweeps right-to-left, unrolling the new column
    const q = eIO(p), X = (1 - q) * (W + 100) - 50;
    I.style.clipPath = `inset(0 0 0 ${Math.max(0, X)}px)`;
    roller.style.display = 'block'; roller.style.left = (X - 43) + 'px';
    O.style.transform = `translateX(${-q * 90}px)`;
    out.shade.style.background = 'linear-gradient(to left, rgba(0,0,0,.75), rgba(0,0,0,0) 50%)';
    out.shade.style.opacity = q;
  } else if (type === 'strips') {
    // ruled bands are inscribed one after another, each led by a gold hairline
    const N = 14, hh = H / N; let d = '';
    for (let i = 0; i < N; i++) {
      const qi = ease(p * 1.55 - i * .04);
      const x = W - qi * W;
      d += `M${x.toFixed(1)} ${(i * hh).toFixed(1)}H${W}V${((i + 1) * hh + .6).toFixed(1)}H${x.toFixed(1)}Z`;
      if (qi > 0 && qi < 1) sAdd(fx, 'line', { x1: x, x2: x, y1: i * hh + 3, y2: (i + 1) * hh - 3, stroke: '#EBD28E', 'stroke-width': 2, opacity: .9 });
    }
    I.style.clipPath = `path('${d}')`;
    O.style.filter = `brightness(${1 - .5 * p})`;
  } else if (type === 'ink') {
    // ink blooms from the last detail with a trembling organic edge
    const [cx, cy] = lastFocus(out);
    const R = ease(p) * Math.hypot(W, H) * 1.18, pts = [];
    for (let j = 0; j <= 160; j++) {
      const a = j / 160 * Math.PI * 2;
      const n = .07 * Math.sin(5 * a + seed) + .045 * Math.sin(11 * a + seed * 2.3 + p * 3) + .025 * Math.sin(23 * a + seed * .7);
      const rr = Math.max(0, R * (1 + n));
      pts.push(`${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)}`);
    }
    const d = 'M' + pts.join('L') + 'Z';
    I.style.clipPath = `path('${d}')`;
    sAdd(fx, 'path', { d, fill: 'none', stroke: '#C9A24A', 'stroke-width': 16, opacity: .14 * (1 - p) });
    sAdd(fx, 'path', { d, fill: 'none', stroke: '#EBD28E', 'stroke-width': 2, opacity: .9 * (1 - p) });
    O.style.filter = `brightness(${1 - .45 * p})`;
  } else if (type === 'page') {
    // the leaf turns on a spine at the right edge, like a Hebrew book
    const q = eIO(p);
    O.style.zIndex = 3; I.style.zIndex = 2;
    O.style.transformOrigin = '100% 50%';
    O.style.transform = `perspective(2600px) rotateY(${-q * 100}deg)`;
    out.shade.style.background = 'linear-gradient(to right, rgba(0,0,0,.85), rgba(0,0,0,.1))';
    out.shade.style.opacity = q * .9;
    inc.shade.style.background = '#000';
    inc.shade.style.opacity = (1 - q) * .6;
  }
}

// ---------- main ----------
window.setTime = function (t) {
  clearFx();
  let i = FRAMES.findIndex(F => t >= F.start && t < F.start + F.dur);
  if (i < 0) i = FRAMES.length - 1;
  FRAMES.forEach(resetFrame);
  const F = FRAMES[i], lt = t - F.start;
  F.el.style.display = 'block';
  render(F, lt);
  if (i > 0 && lt < TD) {
    const O = FRAMES[i - 1];
    O.el.style.display = 'block';
    render(O, t - O.start);
    transition(F.trans, O, F, lt / TD, i * 1.7);
  }
  $('#black').style.opacity = Math.max(1 - eOut(t / .5), eIO((t - (TOTAL - 1.0)) / 1.0));
};

function sampleCovers() {
  document.querySelectorAll('.cover').forEach(c => {
    const img = c.parentElement.querySelector('img');
    const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
    const d = cx.getImageData(20, Math.round(+c.dataset.y * cv.height + 6), 1, 1).data;
    c.style.background = `rgb(${d[0]},${d[1]},${d[2]})`;
    if (c.dataset.shade === '1') c.style.color = 'rgba(29,36,51,.55)';
  });
}

window.ready = (async () => {
  await Promise.all(['400 20px Heebo', '700 20px Heebo', '800 20px Heebo', '500 20px Frank', '700 20px Frank', '900 20px Frank']
    .map(f => document.fonts.load(f, 'שלום')));
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode()));
  sampleCovers();
  window.setTime(0);
  return TOTAL;
})();
</script>
</body>
